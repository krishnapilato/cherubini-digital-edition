name: Deploy web to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - "data/cherubini.json"
      - "guide/**"
      - "tests/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The same Node.js as on the development computer; raised together with it.
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Exactly the versions in package-lock.json, the ones tested locally: any mismatch stops here.
      - run: npm ci

      # The same gate as "npm run dev": unused dependencies, tests, types, lint, formatting,
      # build and interface tests in the Chrome already installed on the runner.
      - run: npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
