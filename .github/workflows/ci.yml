name: CI

# Every push and pull request runs the same checks as a release: types, lint, tests and
# interface tests for the web edition; compiler warnings, PMD, tests and interface tests
# (on the JavaFX headless platform) for the desktop edition.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm i

      - run: npm test

      - run: npm run build

      # Interface tests on the production build, in the Chrome already installed on the runner.
      - run: npm run e2e

  # The desktop edition is for Windows only (see docs/decisions/0002).
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - run: ./mvnw -B verify
