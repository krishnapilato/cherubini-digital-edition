name: CI

# Every push and pull request runs the same checks as a release: types, lint, tests and
# interface tests for the web edition; compiler warnings, PMD, tests and interface tests
# (on the JavaFX headless platform) for the desktop edition.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The same Node.js as on the development computer; raised together with it.
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Exactly the versions in package-lock.json, the ones tested locally: any mismatch stops here.
      - run: npm ci

      # The same gate as "npm run dev": unused dependencies, tests, types, lint, formatting,
      # build and interface tests in the Chrome already installed on the runner.
      - run: npm run check

  # The desktop edition is for Windows only (see docs/decisions/0002).
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # The same JDK as on the development computer, Oracle JDK 27.0.1.1, raised together with it.
      # setup-java turns a four-part version into "27.0.1+1" and can't find it at Oracle, so the
      # official archive is downloaded here and handed to it as a file.
      - name: Oracle JDK
        run: curl -fsSL -o "$RUNNER_TEMP/jdk.zip" https://download.oracle.com/java/27/archive/jdk-27.0.1.1_windows-x64_bin.zip

      - uses: actions/setup-java@v6
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jdk.zip
          java-version: "27.0.1"
          architecture: x64
          cache: maven
          cache-dependency-path: desktop/pom.xml

      # Prints the Maven and Java versions actually used.
      - run: ./mvnw -v

      - run: ./mvnw -B verify
