name: Desktop release

# The desktop edition is for Windows only (see docs/decisions/0002); every other system uses the web edition.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # The same JDK as on the development computer, Oracle JDK 27.0.1.1, raised together with it.
      # setup-java turns a four-part version into "27.0.1+1" and can't find it at Oracle, so the
      # official archive is downloaded here and handed to it as a file.
      - name: Oracle JDK
        run: curl -fsSL -o "$RUNNER_TEMP/jdk.zip" https://download.oracle.com/java/27/archive/jdk-27.0.1.1_windows-x64_bin.zip

      - uses: actions/setup-java@v6
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/jdk.zip
          java-version: "27.0.1"
          architecture: x64
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Version
        run: |
          # The first <version> of the pom is the project's own.
          version=$(grep -m1 -o '<version>[^<]*' pom.xml | cut -d'>' -f2)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in desktop/pom.xml and web/package.json."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=Vocabolario-Cherubini-$version.zip" >> "$GITHUB_ENV"

      - name: Tool versions
        run: ./mvnw -v

      - name: Jar
        run: ./mvnw -B -q package

      - name: Java runtime
        run: >
          jlink
          --add-modules java.base,java.desktop,java.logging,java.prefs,java.scripting,java.xml,jdk.unsupported,jdk.localedata
          --include-locales=it,en
          --strip-debug --no-header-files --no-man-pages --compress=zip-9
          --output target/runtime

      - name: Portable app
        run: |
          mkdir -p target/app
          cp target/cherubini.jar target/app/
          jpackage --type app-image --name Cherubini --app-version "$VERSION" \
            --vendor "Khova Krishna Pilato" \
            --input target/app --main-jar cherubini.jar \
            --main-class com.cherubinivocabulary.Launcher \
            --runtime-image target/runtime --icon packaging/cherubini.ico \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --dest target/dist

      # Starts the portable app exactly as it is shipped: with --smoke-test it opens the window
      # on the JavaFX headless platform, checks that it shows the vocabulary and quits; any
      # failure, a missing native library included, stops the release.
      - name: Startup check
        timeout-minutes: 3
        run: |
          target/dist/Cherubini/Cherubini.exe --smoke-test
          echo "Cherubini si avvia e mostra il vocabolario"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path target/dist/Cherubini -DestinationPath "target/$env:ZIP"

      # About 10% above the sizes of 1.0.2 (62.2 MB on disk, 44.7 MB zipped), as for the web's
      # JavaScript and CSS. A new JDK that weighs more is a deliberate raise of these numbers.
      - name: Size budget
        run: |
          budget() {
            local name=$1 bytes=$2 limit_mb=$3
            printf '%s: %d.%d MB of %d MB\n' "$name" $((bytes / 1000000)) $((bytes % 1000000 / 100000)) "$limit_mb"
            if (( bytes > limit_mb * 1000000 )); then
              echo "::error::$name is over its budget of $limit_mb MB."
              return 1
            fi
          }
          budget "App on disk" "$(du -sb target/dist/Cherubini | cut -f1)" 68
          budget "Download" "$(stat -c %s "target/$ZIP")" 49

      # The fingerprint lets anyone check that the downloaded file is exactly the one built here.
      - name: Checksum
        working-directory: desktop/target
        run: |
          sha256sum "$ZIP" > SHA256SUMS.txt
          du -sh dist/Cherubini "$ZIP"
          { echo "CHECKSUM<<EOF"; cat SHA256SUMS.txt; echo "EOF"; } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: cherubini-windows
          path: |
            desktop/target/${{ env.ZIP }}
            desktop/target/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            desktop/target/${{ env.ZIP }}
            desktop/target/SHA256SUMS.txt
          body: |
            Le voci tecniche del *Vocabolario milanese–italiano*, da consultare anche senza internet e con Java incluso.

            Scarica `${{ env.ZIP }}`, estrai lo zip e apri **Cherubini**. Funziona su Windows 11.

            Su Mac o Linux usa la [versione web](https://krishnapilato.github.io/cherubini-digital-edition/).

            L'app non è firmata digitalmente, quindi al primo avvio Windows chiede conferma: *Ulteriori informazioni* → *Esegui comunque*.

            Se l'impronta del file scaricato coincide con questa, il file è integro (in PowerShell: `Get-FileHash ${{ env.ZIP }}`).

            ```
            ${{ env.CHECKSUM }}
            ```

            <sub>Di Stefano Pilato e [Khova Krishna Pilato](https://www.linkedin.com/in/khovakrishnapilato/)</sub>
