name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
            arch: apple-silicon
            javafx: mac-aarch64
          - os: macos-26-intel
            platform: macos
            arch: intel
            javafx: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      ICON_PNG: src/main/resources/com/cherubinivocabulary/cherubinivocabulary/icon.png
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: desktop/pom.xml

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Jar
        run: mvn -B -q package -Djavafx.mac.classifier=${{ matrix.javafx || 'mac-aarch64' }}

      - name: Java runtime
        run: >
          jlink
          --add-modules java.base,java.desktop,java.logging,java.prefs,java.scripting,java.sql,java.xml,jdk.unsupported,jdk.localedata
          --include-locales=it,en
          --strip-debug --no-header-files --no-man-pages --compress=zip-9
          --output target/runtime

      - name: macOS icon
        if: matrix.platform == 'macos'
        run: |
          mkdir -p target/Cherubini.iconset
          for size in 16 32 128 256; do
            sips -z "$size" "$size" "$ICON_PNG" --out "target/Cherubini.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$((size * 2))" "$((size * 2))" "$ICON_PNG" --out "target/Cherubini.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns target/Cherubini.iconset -o target/cherubini.icns

      - name: Portable app
        run: |
          case "${{ matrix.platform }}" in
            windows) icon=packaging/cherubini.ico ;;
            macos) icon=target/cherubini.icns ;;
            linux) icon="$ICON_PNG" ;;
          esac
          mkdir -p target/app
          cp target/cherubini.jar target/app/
          jpackage --type app-image --name Cherubini --app-version "$VERSION" \
            --vendor "Stefano Pilato e Khova Krishna Pilato" \
            --input target/app --main-jar cherubini.jar \
            --main-class com.cherubinivocabulary.cherubinivocabulary.Launcher \
            --runtime-image target/runtime --icon "$icon" \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --dest target/dist

      - name: Windows zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path target/dist/Cherubini -DestinationPath target/Cherubini-windows.zip

      - name: macOS zip
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent target/dist/Cherubini.app "target/Cherubini-macos-${{ matrix.arch }}.zip"

      - name: Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          mkdir -p target/AppDir
          cp -r target/dist/Cherubini target/AppDir/
          cp "$ICON_PNG" target/AppDir/cherubini.png
          printf '[Desktop Entry]\nType=Application\nName=Cherubini\nComment=Vocabolario milanese-italiano di Francesco Cherubini\nExec=Cherubini\nIcon=cherubini\nCategories=Education;\n' > target/AppDir/cherubini.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/Cherubini/bin/Cherubini" "$@"\n' > target/AppDir/AppRun
          chmod +x target/AppDir/AppRun
          curl -sfL -o target/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x target/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 target/appimagetool --no-appstream target/AppDir target/Cherubini-linux-x86_64.AppImage

      - name: Size
        run: du -sh target/dist/* target/Cherubini-*

      - uses: actions/upload-artifact@v7
        with:
          name: cherubini-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: |
            desktop/target/Cherubini-windows.zip
            desktop/target/Cherubini-macos-*.zip
            desktop/target/Cherubini-linux-x86_64.AppImage
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            ## Vocabolario Cherubini — versione portatile

            Non serve installare niente, nemmeno Java: è già incluso. Scarica il file del tuo sistema e aprilo.

            | Sistema | File | Come si apre |
            |---|---|---|
            | Windows 10/11 | `Cherubini-windows.zip` | Estrai lo zip e apri `Cherubini.exe` dentro la cartella |
            | macOS con chip Apple (M1 e successivi) | `Cherubini-macos-apple-silicon.zip` | Estrai lo zip e apri `Cherubini.app` |
            | macOS con processore Intel | `Cherubini-macos-intel.zip` | Estrai lo zip e apri `Cherubini.app` |
            | Linux | `Cherubini-linux-x86_64.AppImage` | Rendilo eseguibile (`chmod +x`) e aprilo |

            ### Gli avvisi al primo avvio

            Il programma non è firmato digitalmente (la firma ha un costo annuale), quindi il sistema chiede conferma la prima volta:

            - **Windows**: compare «Windows ha protetto il PC». Clicca **Ulteriori informazioni** e poi **Esegui comunque**.
            - **macOS**: compare «Impossibile verificare che Cherubini non contenga malware». Clicca **Fine**, poi apri Impostazioni di Sistema → **Privacy e sicurezza**, scorri fino in fondo e clicca **Apri comunque** accanto a Cherubini. Conferma con la password o il Touch ID: dalla volta successiva si apre normalmente.
              Per sapere quale file scaricare: menu Apple → **Informazioni su questo Mac**. Se alla voce «Chip» c'è Apple M1, M2, M3, M4 o successivi, scegli la versione per chip Apple; se c'è «Processore» Intel, scegli quella Intel.
            - **Linux**: nessun avviso; serve solo rendere eseguibile il file.

            A cura di Stefano Pilato e Khova Krishna Pilato.
